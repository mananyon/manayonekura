<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 246" width="2120" height="492">
<style>
text{font-family:"Meiryo","Noto Sans JP","IPAPGothic",sans-serif;fill:#2B2620}
.bx{fill:#FCF8F0;stroke:#D2C4AE;stroke-width:1.2}
.bxa{fill:#F3E3DE;stroke:#9C5446;stroke-width:1.6}
.ln{stroke:#8B8175;stroke-width:1.4;fill:none}
.lna{stroke:#9C5446;stroke-width:1.6;fill:none;stroke-dasharray:5 4}
.t1{font-size:17px;font-weight:700}.t2{font-size:13px;fill:#6E665C}
.t3{font-size:15px}.lb{font-size:12.5px;fill:#6E665C}
.lba{font-size:12.5px;fill:#9C5446;font-weight:700}
.num{font-size:14px;fill:#9C5446;font-weight:700}
</style>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8B8175"/></marker>
<marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9C5446"/></marker>
</defs>
<rect class="bx" x="1" y="77" width="214" height="60" rx="6"/>
<text class="t1" x="108" y="103" text-anchor="middle">毎日30秒の記録</text>
<text class="t2" x="108" y="123" text-anchor="middle">気・血・水・心 を各3項目</text>
<line class="ln" x1="215" y1="107" x2="288" y2="107" marker-end="url(#ar)"/>
<text class="lb" x="251" y="97" text-anchor="middle">記録</text>
<rect class="bxa" x="295" y="77" width="186" height="60" rx="6"/>
<text class="t1" x="388" y="113" text-anchor="middle" fill="#9C5446">未病ノート</text>
<line class="ln" x1="481" y1="107" x2="592" y2="107" marker-end="url(#ar)"/>
<text class="lb" x="536" y="97" text-anchor="middle">その場で返す</text>
<rect class="bx" x="600" y="30" width="459" height="46" rx="6"/>
<text class="num" x="620" y="59">1</text><text class="t3" x="640" y="59">いま、同じ人がいます</text>
<rect class="bx" x="600" y="84" width="459" height="46" rx="6"/>
<text class="num" x="620" y="113">2</text><text class="t3" x="640" y="113">去年の今頃も、同じでした</text>
<rect class="bx" x="600" y="138" width="459" height="46" rx="6"/>
<text class="num" x="620" y="167">3</text><text class="t3" x="640" y="167">明後日は崩れやすい</text>
<path class="lna" d="M830,184 L830,222 L108,222 L108,143" marker-end="url(#ara)"/>
<text class="lba" x="469" y="213" text-anchor="middle">また開きたくなる ＝ 記録が続く</text>
</svg>
